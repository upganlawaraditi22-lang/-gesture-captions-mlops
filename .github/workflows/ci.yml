name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build image
        run: docker build -t gesture-captions:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8501:8501 -p 9100:9100 gesture-captions:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS http://localhost:9100/metrics | grep gesture_model_info
      - name: Show app logs
        if: always()
        run: docker logs app || true

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - uses: azure/setup-kubectl@v4
      - name: Check Kubernetes files build
        run: |
          rendered="$(scripts/render_k8s.sh example.azurecr.io/gesture-captions test example centralindia)"
          kubectl kustomize "$rendered" > /dev/null
          kubectl kustomize monitoring > /dev/null
