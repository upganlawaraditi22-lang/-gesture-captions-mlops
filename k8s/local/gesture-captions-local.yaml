# Run the app on Kubernetes in Docker Desktop, using an image built on this computer.
#   docker tag gesture-captions-mlops-app:latest gesture-captions:local
#   kubectl apply -f k8s/local/gesture-captions-local.yaml
# Open the app: kubectl port-forward -n gesture-captions svc/gesture-captions 8501:8501
apiVersion: v1
kind: Namespace
metadata:
  name: gesture-captions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gesture-captions
  namespace: gesture-captions
  labels:
    app: gesture-captions
spec:
  # Streamlit keeps each session in pod memory, so more replicas would need sticky routing.
  replicas: 1
  selector:
    matchLabels:
      app: gesture-captions
  template:
    metadata:
      labels:
        app: gesture-captions
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: gesture-captions:local
          imagePullPolicy: Never
          env:
            - name: MODEL_VERSION
              value: local
          ports:
            - name: http
              containerPort: 8501
            - name: metrics
              containerPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gesture-captions
  namespace: gesture-captions
  labels:
    app: gesture-captions
spec:
  type: NodePort
  selector:
    app: gesture-captions
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30501
    - name: metrics
      port: 9100
      targetPort: metrics
      nodePort: 30910
